<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Azure Local Sonar">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A86D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A70;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001A3A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="38" ry="38" fill="url(#bgGrad)"/>

  <g opacity="0.08" stroke="white" stroke-width="0.8">
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>

  <!-- Badge polygon top (family mark) -->
  <g transform="translate(100,32)" filter="url(#shadow)">
    <polygon points="0,-14 14,-5 10,12 0,7 -10,12 -14,-5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="white">L</text>
  </g>

  <!-- Sonar glyph: range rings, a sweep and two echoes -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="46" fill="white"/>
    <circle cx="100" cy="100" r="38" fill="url(#bgGrad)"/>

    <!-- Range rings and cross hairs -->
    <g fill="none" stroke="white" stroke-width="1.2" opacity="0.35">
      <circle cx="100" cy="100" r="12"/>
      <circle cx="100" cy="100" r="24"/>
    </g>
    <g stroke="white" stroke-width="1" opacity="0.25">
      <line x1="64" y1="100" x2="136" y2="100"/>
      <line x1="100" y1="64" x2="100" y2="136"/>
    </g>

    <!-- Sweep -->
    <path d="M100 100 L93.75 64.55 A36 36 0 0 1 125.46 74.54 Z" fill="#E74C3C" opacity="0.45"/>
    <line x1="100" y1="100" x2="125.46" y2="74.54" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

    <!-- Echoes -->
    <circle cx="117" cy="83" r="3" fill="white" opacity="0.9"/>
    <circle cx="80" cy="112" r="2.4" fill="#E74C3C" opacity="0.85"/>

    <circle cx="100" cy="100" r="3" fill="white"/>

    <circle cx="100" cy="100" r="38" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  </g>

  <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="white" letter-spacing="1" opacity="0.95">AZURE LOCAL</text>
  <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#E74C3C" letter-spacing="1.5" opacity="0.95">SONAR</text>
</svg>
